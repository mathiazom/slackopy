name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `pnpm install --frozen-lockfile` on the pinned Node image. The site
      # itself can't be built here, since it needs a live slackback.
      - name: Build image
        run: docker build -t slackopy:ci .

      - name: Smoke test
        run: docker run --rm --entrypoint sh slackopy:ci -c 'node --check builder.mjs && pnpm exec astro --version'
